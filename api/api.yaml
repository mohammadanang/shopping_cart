  /cart/v1:
    post:
      # security:
      #   - BearerAuth: []
      tags:
        - Cart
      summary: Add or edit a cart
      description: Adds or edits a shopping cart.
      operationId: AddCart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartCreateInput"
      responses:
        "201":
          description: Cart added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartSuccessResponse"
        "200":
          description: Cart edited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartSuccessResponse"
        "500":
          description: Failed to add cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags:
        - Cart
      summary: List all carts
      parameters:
        - $ref: "#/components/parameters/OrderIdParam"
      # security:
      #   - BearerAuth: []
      description: |
        Retrieves a list of all shopping carts.
      operationId: ListCarts
      responses:
        "200":
          description: All carts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartListSuccessResponse"
        "500":
          description: Failed to retrieve carts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Data not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Enter your **JWT Bearer Token** to authorize requests.  
        Example: `Authorization: Bearer <your-token>`
    ApiKeyAuth:
      type: apiKey
      name: x-api-key
      in: header
      description: |
        Enter your **API Key** to authorize requests.  
        Example: `x-api-key: <your-api-key>`

  parameters:
    # IdParam:
    #   name: id
    #   in: path
    #   required: true
    #   description: The ID of the data to remove
    #   example: 1
    #   style: form
    #   schema:
    #     type: integer
    #     format: int32
    OrderIdParam:
      name: order_id
      in: query
      required: true
      description: The order id of the data to retrieve
      example: 1
      style: form
      allowEmptyValue: false
      schema:
        type: string
        format: int32
        nullable: false
    # PageParam:
    #   name: page
    #   in: query
    #   required: false
    #   description: The page number to retrieve
    #   example: 1
    #   style: form
    #   allowEmptyValue: true
    #   schema:
    #     type: integer
    #     format: int32
    #     nullable: true
    # SizeParam:
    #   name: size
    #   in: query
    #   required: false
