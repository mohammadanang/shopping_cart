    #   example: 10
    #   style: form
    #   allowEmptyValue: true
    #   schema:
    #     type: integer
    #     format: int32
    #     nullable: true
  schemas:
    # Common Sections
    ErrorResponse:
      type: object
      description: Represents an error response from the API.
      required: [message, code, status]
      properties:
        message:
          type: string
          description: Error message
          example: "Data not found"
        code:
          type: integer
          description: Error code
          example: 400
        status:
          type: string
          description: Error status
          example: "error"
    MetaData:
      type: object
      description: Metadata about the response
      properties:
        page:
          type: integer
          format: int32
          description: Current page number
          example: 1
        size:
          type: integer
          format: int32
          description: Number of items per page
          example: 10
        total_data:
          type: integer
          format: int64
          description: Total number of items
          example: 50
        total_pages:
          type: integer
          format: int32
          description: Total number of pages
          example: 5
    # Order Sections
    # Order:
    #   $ref: "./schemas/order/order.yaml"
    # OrderCreateInput:
    #   $ref: "./schemas/order/create.yaml"
    # OrderUpdateInput:
    #   $ref: "./schemas/order/update.yaml"
