    #       type: integer
    #       description: Success code
    #       example: 200
    #     status:
    #       type: string
    #       description: Success status
    #       example: "success"
    # Cart Sections
    CartCreateInput:
      type: object
      description: Create cart item model
      required: [product_name, qty, price, order_id]
      properties:
        product_name:
          type: string
        qty:
          type: integer
          format: int32
        price:
          type: integer
          format: float
        order_id:
          type: integer
          format: int64
    Cart:
      type: object
      description: Cart item model
      required: [id, product_name, qty, price, order_id, created_at, updated_at, order_number]
      properties:
        id:
          type: integer
          format: int64
        product_name:
          type: string
        qty:
          type: integer
          format: int32
        price:
          type: integer
          format: float64
        order_id:
          type: integer
          format: int64
        created_at:
          type: string
        updated_at:
          type: string
        order_number:
          type: string
    CartSuccessResponse:
      type: object
      required: [data, message, code, status]
      properties:
        data:
          type: object
          description: Cart item data
          $ref: "#/components/schemas/Cart"
          example:
            id: 1
            product_name: "Sample Product"
            qty: 2
            price: 100
            order_id: 123
            created_at: "2023-10-01 12:00:00"
            updated_at: "2023-10-01 12:00:00"
        message:
          type: string
          description: Success message
          example: "Cart item list retrieved successfully"
        code:
          type: integer
          description: Success code
          example: 200
        status:
          type: string
          description: Success status
          example: "success"
    CartListSuccessResponse:
      type: object
      required: [data, message, code, status]
      properties:
        data:
          type: array
          description: List of cart items
          items:
            $ref: "#/components/schemas/Cart"
          example:
            - id: 1
              product_name: "Sample Product"
              qty: 2
              price: 100
              order_id: 123
              created_at: "2023-10-01 12:00:00"
              updated_at: "2023-10-01 12:00:00"
              order_number: "ORD123456"
        message:
          type: string
          description: Success message
          example: "Cart items retrieved successfully"
        code:
          type: integer
          description: Success code
          example: 200
        status:
          type: string
          description: Success status
          example: "success"
